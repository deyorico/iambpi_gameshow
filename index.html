<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Show Buzzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1233;--panel:#2a1d4d;--ink:#fff6e0;--dim:#b7a9d9;--gold:#ffc83d;--go:#2ee6a6;--stop:#ff4f6d;--line:#43336f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-weight:500}
body{padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
h1,h2,.big{font-family:'Archivo Black',Impact,sans-serif;font-weight:400;margin:0}
#app{max-width:640px;margin:0 auto;padding:20px 0 40px}
input{width:100%;font:inherit;font-size:20px;padding:16px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink)}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px 18px;background:var(--gold);color:#2a1d00;cursor:pointer}
button.alt{background:var(--panel);color:var(--ink);border:2px solid var(--line)}
button:disabled{opacity:.5}
.stack{display:grid;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.dim{color:var(--dim)}
.buzzer{width:min(78vw,320px);aspect-ratio:1;border-radius:50%;margin:24px auto;display:grid;place-items:center;font-family:'Archivo Black',Impact,sans-serif;font-size:44px;border:10px solid rgba(0,0,0,.25);touch-action:manipulation;user-select:none}
.buzzer.wait{background:#4a3b78;color:var(--dim)}
.buzzer.open{background:var(--go);color:#06382a;box-shadow:0 0 0 0 rgba(46,230,166,.6);animation:pulse 1.2s infinite}
.buzzer.done{background:var(--gold);color:#2a1d00}
@keyframes pulse{to{box-shadow:0 0 0 28px rgba(46,230,166,0)}}
@media (prefers-reduced-motion:reduce){.buzzer.open{animation:none}}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--panel);border-radius:12px}
.rank{font-family:'Archivo Black',Impact,sans-serif;font-size:22px;min-width:34px;color:var(--gold)}
.score{font-family:'Archivo Black',Impact,sans-serif;font-size:26px}
.pill{padding:4px 12px;border-radius:99px;font-weight:700;font-size:14px}
.pill.open{background:var(--go);color:#06382a}.pill.closed{background:var(--stop);color:#fff}
.board .item{padding:12px 18px}.board .rank,.board .score{font-size:34px}.board .nm{font-size:28px;font-weight:700}
.sm{padding:8px 12px;font-size:15px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.av{border-radius:50%;object-fit:cover;border:4px solid;display:grid;place-items:center;font-family:'Archivo Black',Impact,sans-serif;color:#1b1233;flex:none;overflow:hidden}
.sw{display:flex;flex-wrap:wrap;gap:12px}
.sw button{width:48px;height:48px;border-radius:50%;padding:0;border:4px solid transparent}
.sw button.on{border-color:#fff;box-shadow:0 0 0 3px var(--bg) inset}
.pick{display:flex;align-items:center;gap:14px}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== EDIT THESE ======
const SUPABASE_URL = 'https://vtdtyjemjzapcvptpwco.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_77WU69S9RIKkDVdcxc-NVg_HI6i8148';
const HOST_PIN = 'corepcpm';
// ========================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const q = new URLSearchParams(location.search);
const mode = q.has('host') ? 'host' : q.has('board') ? 'board' : 'play';
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let players = [], state = {round:0, status:'closed'}, buzzes = [], me = null, hostOK = false, step = 10;

try { me = localStorage.getItem('playerId'); } catch(e){}

async function refresh(){
  const [p, s] = await Promise.all([
    sb.from('players').select('*').order('created_at'),
    sb.from('game_state').select('*').eq('id',1).single()
  ]);
  if (p.data) players = p.data;
  if (s.data) state = s.data;
  const b = await sb.from('buzzes').select('*').eq('round', state.round).order('created_at');
  if (b.data) buzzes = b.data;
  if (me && !players.find(x => x.id === me)) { me = null; try{localStorage.removeItem('playerId')}catch(e){} }
  render();
}
let t; const soon = () => { clearTimeout(t); t = setTimeout(refresh, 60); };
['players','game_state','buzzes'].forEach(tb => sb.channel('c-'+tb).on('postgres_changes',{event:'*',schema:'public',table:tb},soon).subscribe());
setInterval(refresh, 4000); // safety net if realtime drops

const COLORS = ['#ff4f6d','#ff9f43','#ffc83d','#2ee6a6','#36d1dc','#4f8cff','#a066ff','#ff6fd8','#c4ff4f','#ffffff'];
function av(p, size=44){
  const c = (p && p.color) || '#b7a9d9', st = `width:${size}px;height:${size}px;border-color:${c};background:${c};font-size:${size*0.42}px`;
  if (p && p.photo) return `<img class="av" style="${st}" src="${p.photo}" alt="">`;
  return `<div class="av" style="${st}">${esc(((p && p.name) || '?').trim().charAt(0).toUpperCase())}</div>`;
}
const pl = id => players.find(p => p.id === id);
const nameOf = id => (players.find(p => p.id === id) || {name:'?'}).name;
const ranked = () => [...players].sort((a,b) => b.score - a.score || a.name.localeCompare(b.name));

function render(){
  if (mode === 'host') return hostOK ? renderHost() : renderPin();
  if (mode === 'board') return renderBoard();
  return me ? renderPlay() : renderJoin();
}

/* ---------- Player ---------- */
let draft = {color: COLORS[0], photo: null};
function resizeSelfie(file){
  return new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const n = 192, c = document.createElement('canvas'); c.width = c.height = n;
      const m = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, n, n);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.75));
    };
    img.src = url;
  });
}
function renderJoin(){
  if (document.getElementById('nm')) return;
  app.innerHTML = `<div class="stack"><h1 style="font-size:34px">Join the game</h1>
    <input id="nm" maxlength="20" placeholder="Your name" autocomplete="off">
    <div><div class="dim" style="margin-bottom:8px">Pick your color</div>
      <div class="sw">${COLORS.map(c => `<button data-c="${c}" style="background:${c}" class="${c===draft.color?'on':''}" aria-label="Color ${c}"></button>`).join('')}</div></div>
    <div class="pick"><div id="pv"></div>
      <label><input id="ph" type="file" accept="image/*" capture="user" hidden>
        <span class="alt" style="display:inline-block;padding:14px 18px;border-radius:12px;font-weight:700;background:var(--panel);border:2px solid var(--line);cursor:pointer">Take a selfie</span></label></div>
    <button id="go">Join game</button></div>`;
  const pv = () => document.getElementById('pv').innerHTML = av({name: document.getElementById('nm').value || '?', color: draft.color, photo: draft.photo}, 72);
  pv();
  document.getElementById('nm').oninput = pv;
  app.querySelectorAll('.sw button').forEach(b => b.onclick = () => {
    draft.color = b.dataset.c; app.querySelectorAll('.sw button').forEach(x => x.classList.toggle('on', x === b)); pv();
  });
  document.getElementById('ph').onchange = async e => { if (e.target.files[0]) { draft.photo = await resizeSelfie(e.target.files[0]); pv(); } };
  document.getElementById('go').onclick = async () => {
    const name = document.getElementById('nm').value.trim();
    if (!name) return alert('Enter your name first');
    const {data, error} = await sb.from('players').insert({name, color: draft.color, photo: draft.photo}).select().single();
    if (error) return alert('Could not join: ' + error.message);
    me = data.id; try{localStorage.setItem('playerId', me)}catch(e){}
    refresh();
  };
}

function renderPlay(){
  const mine = buzzes.findIndex(b => b.player_id === me);
  const open = state.status === 'open';
  let cls = 'wait', label = 'WAIT', note = 'Waiting for the host to open the buzzer';
  if (mine >= 0) { cls = 'done'; label = '#' + (mine+1); note = mine === 0 ? 'You buzzed first!' : 'You are number ' + (mine+1) + ' in line'; }
  else if (open) { cls = 'open'; label = 'BUZZ'; note = 'Tap now!'; }
  const you = players.find(p => p.id === me);
  app.innerHTML = `<div style="text-align:center">
    <div class="row">${av(you,52)}<div class="grow" style="text-align:left"><b>${esc(you ? you.name : '')}</b></div><div class="score">${you ? you.score : 0} pts</div></div>
    <button id="b" class="buzzer ${cls}" style="border-color:${you ? you.color : 'rgba(0,0,0,.25)'}" ${cls==='open'?'':'disabled'}>${label}</button>
    <p class="dim">${note}</p></div>`;
  const btn = document.getElementById('b');
  btn.onpointerdown = async e => {
    if (!btn.classList.contains('open')) return;
    e.preventDefault();
    btn.className = 'buzzer done'; btn.textContent = '...'; btn.disabled = true;
    if (navigator.vibrate) navigator.vibrate(60);
    await sb.rpc('buzz', {p_player: me});
    refresh();
  };
}

/* ---------- Host ---------- */
function renderPin(){
  app.innerHTML = `<div class="stack"><h1 style="font-size:30px">Host login</h1>
    <input id="pin" type="password" inputmode="numeric" placeholder="Host PIN"><button id="ok">Enter</button></div>`;
  document.getElementById('ok').onclick = () => {
    if (document.getElementById('pin').value === HOST_PIN) { hostOK = true; render(); } else alert('Wrong PIN');
  };
}

async function setState(patch){ await sb.from('game_state').update(patch).eq('id',1); refresh(); }
async function addScore(id, d){
  const p = players.find(x => x.id === id);
  p.score += d; render();
  await sb.from('players').update({score: p.score}).eq('id', id);
}

function renderHost(){
  const first = buzzes[0] ? new Date(buzzes[0].created_at).getTime() : 0;
  const open = state.status === 'open';
  const keep = document.getElementById('step');
  if (keep) step = +keep.value || 10;
  app.innerHTML = `<div class="stack">
    <div class="row"><h1 class="grow" style="font-size:28px">Host</h1>
      <span class="pill ${state.status}">${open ? 'Buzzer open' : 'Buzzer closed'}</span></div>
    <div class="row">
      <button class="grow" id="next">Start new round (round ${state.round + 1})</button>
      <button class="alt" id="close" ${open?'':'disabled'}>Close</button></div>
    <h2 style="font-size:20px">Buzz order (${buzzes.length}/${players.length})</h2>
    ${buzzes.length ? buzzes.map((b,i) => `<div class="item"><span class="rank">${i+1}</span>
      ${av(pl(b.player_id),40)}<span class="grow">${esc(nameOf(b.player_id))}</span>
      <span class="dim">${i ? '+' + ((new Date(b.created_at).getTime()-first)/1000).toFixed(3) + 's' : 'first'}</span>
      <button class="sm" data-a="${b.player_id}" data-d="1">+</button>
      <button class="sm alt" data-a="${b.player_id}" data-d="-1">-</button></div>`).join('')
      : '<p class="dim">No buzzes yet this round.</p>'}
    <h2 style="font-size:20px">Leaderboard</h2>
    <div class="row"><span class="dim">Points per tap</span><input id="step" type="number" value="${step}" style="width:100px;padding:8px;font-size:18px"></div>
    ${ranked().map((p,i) => `<div class="item"><span class="rank">${i+1}</span>${av(p,40)}<span class="grow">${esc(p.name)}</span>
      <span class="score">${p.score}</span>
      <button class="sm" data-s="${p.id}" data-d="1">+</button>
      <button class="sm alt" data-s="${p.id}" data-d="-1">-</button>
      <button class="sm alt" data-x="${p.id}" title="Remove player">x</button></div>`).join('') || '<p class="dim">No players yet. Share the link.</p>'}
    <button class="alt" id="rs">Reset all scores to 0</button>
    <p class="dim">Board for the projector: add <b>?board</b> to the site address.</p></div>`;
  document.getElementById('next').onclick = () => setState({round: state.round + 1, status:'open'});
  document.getElementById('close').onclick = () => setState({status:'closed'});
  document.getElementById('rs').onclick = async () => { if (confirm('Reset every score to 0?')) { await sb.from('players').update({score:0}).neq('id','00000000-0000-0000-0000-000000000000'); refresh(); } };
  app.querySelectorAll('[data-s],[data-a]').forEach(b => b.onclick = () => addScore(b.dataset.s || b.dataset.a, (+b.dataset.d) * (+document.getElementById('step').value || 1)));
  app.querySelectorAll('[data-x]').forEach(b => b.onclick = async () => { if (confirm('Remove this player?')) { await sb.from('players').delete().eq('id', b.dataset.x); refresh(); } });
}

/* ---------- Board (projector) ---------- */
function renderBoard(){
  app.style.maxWidth = '1400px';
  const open = state.status === 'open';
  const first = buzzes[0] ? new Date(buzzes[0].created_at).getTime() : 0;
  app.innerHTML = `<div class="split">
    <div class="stack board"><h1 style="font-size:40px">Leaderboard</h1>
      ${ranked().map((p,i) => `<div class="item"><span class="rank">${i+1}</span>${av(p,56)}<span class="grow nm">${esc(p.name)}</span><span class="score">${p.score}</span></div>`).join('') || '<p class="dim">Waiting for players...</p>'}</div>
    <div class="stack board"><div class="row"><h1 class="grow" style="font-size:40px">${state.round ? 'Round ' + state.round : 'Buzz order'}</h1>
      <span class="pill ${state.status}">${open ? 'Buzzer open' : 'Buzzer closed'}</span></div>
      ${buzzes.length ? buzzes.map((b,i) => `<div class="item"><span class="rank">${i+1}</span>${av(pl(b.player_id),56)}<span class="grow nm">${esc(nameOf(b.player_id))}</span><span class="dim">${i ? '+' + ((new Date(b.created_at).getTime()-first)/1000).toFixed(3) + 's' : 'FIRST'}</span></div>`).join('')
        : `<p class="dim" style="font-size:22px">${open ? 'Buzzer is open... waiting for the first buzz!' : 'Waiting for the next round.'}</p>`}</div></div>`;
}

refresh();
</script>
</body>
</html>
